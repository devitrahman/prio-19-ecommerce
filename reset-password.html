<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prio 19ツ — নতুন পাসওয়ার্ড</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#f3f5fa;color:#172033;font-family:system-ui,sans-serif}.card{width:min(100%,440px);background:white;border:1px solid #e1e6ef;border-radius:14px;padding:24px;box-shadow:0 10px 35px #17203312}h1{font-size:22px;margin-top:0}p{line-height:1.6}label{display:block;margin:14px 0 6px}input,button{width:100%;padding:12px;border-radius:8px;font:inherit}input{border:1px solid #c8d0dd}button{margin-top:16px;border:0;background:#176b53;color:white;cursor:pointer}.notice{padding:12px;background:#edf3ff;border-radius:8px;white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body><main class="card">
<h1>Prio 19ツ — নতুন পাসওয়ার্ড</h1>
<p>ইমেইলে পাওয়া পাসওয়ার্ড রিসেট লিংক দিয়ে এই পেজে এসে নতুন পাসওয়ার্ড দিন।</p>
<div id="notice" class="notice">লিংক যাচাই করা হচ্ছে…</div>
<form id="form" hidden>
<label for="password">নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">পাসওয়ার্ড আবার লিখুন</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">নতুন পাসওয়ার্ড সংরক্ষণ</button>
</form>
<p><a href="/admin-supabase.html">অ্যাডমিন লগইন পেজে ফিরুন</a></p>
</main>
<script>
(()=>{const URL="https://ecofcxvsqoqostiaoovw.supabase.co";const KEY="sb_publishable_qqG2hvIe19FC5Tohtj62sA_vvjasLSN";const note=s=>document.getElementById("notice").textContent=s;const form=document.getElementById("form");if(!window.supabase){note("Supabase লোড হয়নি। ইন্টারনেট পরীক্ষা করে আবার চেষ্টা করুন।");return}const db=window.supabase.createClient(URL,KEY);let ready=false;
async function init(){const hash=new URLSearchParams(location.hash.slice(1));if(hash.get("error_description")){note("রিসেট লিংকে সমস্যা: "+hash.get("error_description").replace(/\+/g," "));return}const {data,error}=await db.auth.getSession();if(error){note("লিংক যাচাই হয়নি: "+error.message);return}if(data.session){ready=true;form.hidden=false;note("লিংক ঠিক আছে। এখন নতুন পাসওয়ার্ড দিন।");return}note("এই রিসেট লিংকটি মেয়াদোত্তীর্ণ বা ব্যবহার করা হয়েছে। অ্যাডমিন লগইন পেজ থেকে নতুন রিসেট ইমেইল পাঠান।")}
db.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session){ready=true;form.hidden=false;note("লিংক ঠিক আছে। এখন নতুন পাসওয়ার্ড দিন।")}});
form.addEventListener("submit",async e=>{e.preventDefault();if(!ready){note("আগে ইমেইলের নতুন রিসেট লিংক খুলুন।");return}const p=document.getElementById("password").value;const c=document.getElementById("confirm").value;if(p.length<8){note("পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।");return}if(p!==c){note("দুটি পাসওয়ার্ড মিলছে না।");return}const {error}=await db.auth.updateUser({password:p});if(error){note("পাসওয়ার্ড বদলানো যায়নি: "+error.message);return}await db.auth.signOut();form.hidden=true;note("পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে। এখন অ্যাডমিন লগইন পেজে গিয়ে নতুন পাসওয়ার্ড দিয়ে লগইন করুন।")});
init();
})();
</script></body></html>
