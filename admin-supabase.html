<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prio 19ツ — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#172033;font-family:system-ui,sans-serif}header{background:#14213d;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}main{max-width:1050px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:18px;margin:14px 0}h1{font-size:21px;margin:0}h2{font-size:19px;margin:0 0 12px}label{display:block;margin:10px 0 5px;font-size:14px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d0dd;border-radius:7px;font:inherit}button{border:0;border-radius:7px;background:#176b53;color:white;padding:10px 13px;cursor:pointer;margin:3px}button.secondary{background:#42506a}button.danger{background:#b42318}.hidden{display:none!important}.notice{padding:12px;background:#edf3ff;border-radius:8px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin-top:14px}td,th{text-align:left;border-bottom:1px solid #e5e8ef;padding:10px;vertical-align:top}.muted{color:#667085;font-size:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:13px}}
</style></head><body>
<header><h1>Prio 19ツ — Admin Panel</h1><button id="logout" class="secondary hidden">লগআউট</button></header><main>
<div id="notice" class="notice">Supabase সংযোগ পরীক্ষা হচ্ছে…</div>
<section id="loginCard" class="card"><h2>অ্যাডমিন লগইন</h2><p class="muted">Supabase Auth-এ তৈরি করা admin ইমেইল ও পাসওয়ার্ড ব্যবহার করুন।</p><form id="loginForm"><label>ইমেইল</label><input type="email" name="email" required autocomplete="username"><label>পাসওয়ার্ড</label><input type="password" name="password" required autocomplete="current-password"><p><button type="submit">লগইন</button> <button type="button" id="forgotPassword" class="secondary">পাসওয়ার্ড ভুলে গেছেন?</button></p></form></section>
<section id="panel" class="hidden"><div class="tabs"><button data-tab="products">পণ্য পরিচালনা</button><button data-tab="orders">অর্ডার পরিচালনা</button></div>
<section id="productsTab" class="card"><h2>পণ্য যোগ করুন</h2><form id="productForm"><div class="grid"><div><label>পণ্যের নাম</label><input name="name" required maxlength="160"></div><div><label>ক্যাটাগরি</label><input name="category" required maxlength="80"></div><div><label>দাম (৳)</label><input name="price" type="number" min="0" step=".01" required></div><div><label>স্টক</label><input name="stock" type="number" min="0" step="1" value="0" required></div></div><label>বিবরণ</label><textarea name="description" rows="2"></textarea><label>ছবির URL (ঐচ্ছিক)</label><input name="image_url" type="url"><p><button type="submit">পণ্য সংরক্ষণ</button><button type="button" id="refreshProducts" class="secondary">রিফ্রেশ</button></p></form><div class="table-wrap"><table><thead><tr><th>পণ্য</th><th>দাম</th><th>স্টক</th><th>কাজ</th></tr></thead><tbody id="productRows"></tbody></table></div></section>
<section id="ordersTab" class="card hidden"><h2>অর্ডার পরিচালনা</h2><button id="refreshOrders">অর্ডার রিফ্রেশ</button><div class="table-wrap"><table><thead><tr><th>অর্ডার</th><th>গ্রাহক</th><th>ঠিকানা</th><th>মোট</th><th>স্ট্যাটাস</th><th></th></tr></thead><tbody id="orderRows"></tbody></table></div></section></section>
<p class="muted">এই পেজে কেবল Publishable Key আছে। Secret/service_role key কখনো ওয়েবসাইটে দেবেন না।</p></main>
<script>
(()=>{const URL="https://ecofcxvsqoqostiaoovw.supabase.co";const KEY="sb_publishable_qqG2hvIe19FC5Tohtj62sA_vvjasLSN";const $=id=>document.getElementById(id);const note=s=>$("notice").textContent=s;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>"৳"+Number(n||0).toLocaleString("en-US");const statuses=["নতুন","গৃহীত","প্রস্তুত হচ্ছে","পাঠানো হয়েছে","ডেলিভারি সম্পন্ন","বাতিল"];if(!window.supabase){note("Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট পরীক্ষা করুন।");return}const db=window.supabase.createClient(URL,KEY);let user=null;
async function check(){const {data,error}=await db.auth.getUser();if(error||!data.user){user=null;$("panel").classList.add("hidden");$("loginCard").classList.remove("hidden");$("logout").classList.add("hidden");return}const u=data.user;const {data:p,error:pe}=await db.from("profiles").select("role").eq("user_id",u.id).maybeSingle();if(pe||!p||p.role!=="admin"){await db.auth.signOut();note("এই অ্যাকাউন্টে admin অনুমতি নেই। profiles টেবিলে এই user_id-এর role admin করুন।");return}user=u;$("loginCard").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");note("অ্যাডমিন হিসেবে লগইন: "+u.email);await products();await orders()}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){note("লগইন হয়নি: "+error.message);return}await check()});
$("forgotPassword").addEventListener("click",async()=>{const email=$("loginForm").elements.email.value.trim();if(!email){note("আগে ইমেইল ঘরে তোমার অ্যাডমিন ইমেইল লিখুন।");$("loginForm").elements.email.focus();return}note("রিসেট ইমেইল পাঠানো হচ্ছে…");const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/reset-password.html"});if(error){note("রিসেট ইমেইল পাঠানো যায়নি: "+error.message);return}note("রিসেট ইমেইল পাঠানো হয়েছে। ইমেইল ইনবক্স/Spam দেখুন। লিংকটি খুলে নতুন পাসওয়ার্ড দিন।")});$("logout").onclick=async()=>{await db.auth.signOut();await check();note("লগআউট হয়েছে।")};
$("productForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const row={name:String(f.get("name")).trim(),category:String(f.get("category")).trim(),price:Number(f.get("price")),stock:Number(f.get("stock")),description:String(f.get("description")||""),image_url:String(f.get("image_url")||"").trim()||null,active:true};const {error}=await db.from("products").insert(row);if(error){note("পণ্য সেভ হয়নি: "+error.message);return}e.target.reset();note("পণ্য যোগ হয়েছে।");await products()});
async function products(){const {data,error}=await db.from("products").select("id,name,category,price,stock,active").order("created_at",{ascending:false});if(error){note("পণ্য লোড হয়নি: "+error.message);return}$("productRows").innerHTML=(data||[]).map(p=>'<tr><td><b>'+esc(p.name)+'</b><br>'+esc(p.category)+'</td><td>'+money(p.price)+'</td><td>'+esc(p.stock)+'</td><td><button class="secondary" data-edit="'+esc(p.id)+'">দাম/স্টক</button><button class="danger" data-toggle="'+esc(p.id)+'" data-active="'+p.active+'">'+(p.active?"লুকান":"দেখান")+'</button></td></tr>').join("")||'<tr><td colspan="4">কোনো পণ্য নেই।</td></tr>'}
$("productRows").addEventListener("click",async e=>{const a=e.target.closest("[data-edit]"),b=e.target.closest("[data-toggle]");if(a){const price=prompt("নতুন দাম লিখুন:");if(price===null)return;const stock=prompt("নতুন স্টক লিখুন:");if(stock===null)return;if(price.trim()===""||!Number.isFinite(+price)||+price<0||!Number.isInteger(+stock)||+stock<0){note("দাম বা স্টক সঠিক নয়।");return}const {error}=await db.from("products").update({price:+price,stock:+stock,updated_at:new Date().toISOString()}).eq("id",a.dataset.edit);note(error?"আপডেট হয়নি: "+error.message:"পণ্য আপডেট হয়েছে।");await products()}if(b){const {error}=await db.from("products").update({active:b.dataset.active!=="true",updated_at:new Date().toISOString()}).eq("id",b.dataset.toggle);note(error?"পরিবর্তন হয়নি: "+error.message:"পণ্যের অবস্থা আপডেট হয়েছে।");await products()}});
async function orders(){const {data,error}=await db.from("orders").select("id,customer_name,phone,address,total,status,created_at").order("created_at",{ascending:false}).limit(100);if(error){note("অর্ডার লোড হয়নি: "+error.message);return}$("orderRows").innerHTML=(data||[]).map(o=>'<tr><td>'+esc(o.id.slice(0,8))+'<br><small>'+esc(new Date(o.created_at).toLocaleString())+'</small></td><td>'+esc(o.customer_name)+'<br>'+esc(o.phone)+'</td><td>'+esc(o.address)+'</td><td>'+money(o.total)+'</td><td><select data-status="'+esc(o.id)+'">'+statuses.map(s=>'<option '+(s===o.status?'selected':'')+'>'+esc(s)+'</option>').join("")+'</select></td><td><button data-save="'+esc(o.id)+'">সেভ</button></td></tr>').join("")||'<tr><td colspan="6">কোনো অর্ডার নেই।</td></tr>'}
$("orderRows").addEventListener("click",async e=>{const b=e.target.closest("[data-save]");if(!b)return;const sel=$("orderRows").querySelector('[data-status="'+CSS.escape(b.dataset.save)+'"]');const {error}=await db.from("orders").update({status:sel.value}).eq("id",b.dataset.save);note(error?"অর্ডার আপডেট হয়নি: "+error.message:"অর্ডারের স্ট্যাটাস আপডেট হয়েছে।");await orders()});
$("refreshProducts").onclick=products;$("refreshOrders").onclick=orders;document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{$("productsTab").classList.toggle("hidden",b.dataset.tab!=="products");$("ordersTab").classList.toggle("hidden",b.dataset.tab!=="orders")});check()})();
</script></body></html>
